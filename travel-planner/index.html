<script>
(function() {
  "use strict";

  var currentDest = 0;
  var currentPlan = 0;

  var DEST_NAMES = [
    "黑山+塞尔维亚",
    "土耳其",
    "俄罗斯",
    "格鲁吉亚+亚美尼亚+阿塞拜疆",
    "奥地利+匈牙利+捷克"
  ];

  function escapeHtml(text) {
    var div = document.createElement("div");
    div.textContent = text == null ? "" : String(text);
    return div.innerHTML;
  }

  function escapeRegExp(str) {
    return String(str).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  function stripEmojis(text) {
    if (!text) return "";
    // Remove all emoji and symbol characters
    return text.replace(/[\u{1F300}-\u{1F9FF}\u{2600}-\u{27BF}\u{FE0F}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}\u{25A0}-\u{25FF}\u{2300}-\u{23FF}\u{2764}]/gu, "");
  }

  function renderTable(tableData, className, highlightLastRow) {
    if (!tableData || tableData.length === 0) return "";
    var html = '<div class="table-wrapper"><table class="' + className + '">';
    for (var i = 0; i < tableData.length; i++) {
      var row = tableData[i];
      var isHeader = i === 0;
      var isLast = i === tableData.length - 1;
      var rowClass = "";
      if (isHeader) rowClass = "header-row";
      else if (isLast && highlightLastRow) rowClass = "total-row";
      html += '<tr class="' + rowClass + '">';
      for (var j = 0; j < row.length; j++) {
        var tag = isHeader ? "th" : "td";
        var cellContent = escapeHtml(row[j]);
        cellContent = cellContent.replace(/\n/g, "<br>");
        html += "<" + tag + ">" + cellContent + "</" + tag + ">";
      }
      html += "</tr>";
    }
    html += "</table></div>";
    return html;
  }

  function formatDayContent(content, title) {
    var text = content || "";
    if (title && text.indexOf(title) === 0) {
      text = text.substring(title.length);
    }
    text = text.trim();
    text = escapeHtml(text);
    // Replace ▶️ with newline (attraction paragraph separator)
    text = text.replace(/\u25B6\uFE0F?/g, "\n");
    // Replace section markers (🚗🏨🍜💰❤🛫🛬) with newline
    text = text.replace(/[\u{1F697}\u{1F3D8}\u{1F35C}\u{1F4B0}\u{1F6EB}\u{1F6EC}\u{2764}]/gu, "\n");
    // Remove remaining inline emojis (✈️🚂 etc.)
    text = text.replace(/[\u{1F300}-\u{1F9FF}\u{2600}-\u{27BF}\u{FE0F}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}\u{25A0}-\u{25FF}\u{2300}-\u{23FF}]/gu, "");
    // Insert newline before time markers
    text = text.replace(/(上午：|下午：|晚上：|傍晚：|中午：|清晨：|版本一|版本二)/g, "\n$1");
    // Split into segments, bold title before first colon
    var segments = text.split("\n");
    var result = [];
    for (var i = 0; i < segments.length; i++) {
      var seg = segments[i].trim();
      if (!seg) continue;
      var colonIdx = seg.indexOf("：");
      if (colonIdx > 0) {
        seg = "<strong>" + seg.substring(0, colonIdx) + "</strong>" + seg.substring(colonIdx);
      }
      result.push(seg);
    }
    return result.join("<br>");
  }

  function formatTipContent(text) {
    text = text || "";
    // Split by arrow markers BEFORE stripping emojis
    var arrowChar = "\u25B6";
    var arrowIndex = text.indexOf(arrowChar);
    if (arrowIndex > 0) {
      var intro = text.substring(0, arrowIndex).trim();
      var rest = text.substring(arrowIndex);
      // Split by arrow character (with optional variation selector)
      var items = rest.split(/\u25B6\uFE0F?/);
      var html = "";
      if (intro) {
        html += '<p class="tip-intro">' + escapeHtml(stripEmojis(intro)) + "</p>";
      }
      html += '<ul class="tip-list">';
      for (var i = 0; i < items.length; i++) {
        var item = stripEmojis(items[i].trim());
        if (item) {
          html += "<li>" + escapeHtml(item) + "</li>";
        }
      }
      html += "</ul>";
      return html;
    }
    // No arrow markers, strip emojis and render with line breaks
    text = stripEmojis(text);
    var escaped = escapeHtml(text);
    escaped = escaped.replace(/\n/g, "<br>");
    return escaped;
  }

  function renderCostOverview(plan) {
    var costTable = plan.cost_table;
    if (!costTable || costTable.length === 0) return "";
    var lastRow = costTable[costTable.length - 1];
    var total = "";
    var perPerson = "";

    // Format 1: lastRow = ['合计', '59,922', '人均 29,961元']
    if (lastRow[2]) {
      total = lastRow[1] || "";
      var match = String(lastRow[2]).match(/人均\s*([\d,]+)/);
      perPerson = match ? match[1] : "";
    }
    // Format 2: lastRow = ['人均', '29,166'], prevRow = ['合计（2人）', '58,331']
    else if (lastRow[0] && String(lastRow[0]).indexOf("人均") >= 0) {
      perPerson = String(lastRow[1] || "").replace(/[^\d,]/g, "");
      if (costTable.length >= 2) {
        var prevRow = costTable[costTable.length - 2];
        if (prevRow[0] && String(prevRow[0]).indexOf("合计") >= 0) {
          total = prevRow[1] || "";
        }
      }
    }
    // Fallback: lastRow = ['合计', '59,922']
    else {
      total = lastRow[1] || "";
    }

    return '<div class="cost-overview-card">' +
      '<div class="cost-overview-item">' +
        '<div class="cost-label">合计费用（2人）</div>' +
        '<div class="cost-value">¥' + escapeHtml(total) + "</div>" +
      "</div>" +
      '<div class="cost-overview-divider"></div>' +
      '<div class="cost-overview-item">' +
        '<div class="cost-label">人均费用</div>' +
        '<div class="cost-value">¥' + escapeHtml(perPerson) + "</div>" +
      "</div>" +
    "</div>";
  }

  function renderDayCard(day, dayIndex) {
    var title = stripEmojis(day.title || "");
    var dayMatch = title.match(/Day\s*\d+/i);
    var dayLabel = dayMatch ? dayMatch[0] : "";
    var content = formatDayContent(day.content || "", day.title || "");
    var html = '<div class="day-card">' +
      '<div class="day-label">' + escapeHtml(dayLabel) + "</div>" +
      '<div class="day-body">' +
        '<h4 class="day-title">' + escapeHtml(title) + "</h4>";
    
    // Add photos before content, centered with captions
    var photos = null;
    if (typeof PHOTO_MAP_PLANS !== "undefined" && PHOTO_MAP_PLANS[currentDest] &&
        PHOTO_MAP_PLANS[currentDest][currentPlan] && PHOTO_MAP_PLANS[currentDest][currentPlan][dayIndex]) {
      photos = PHOTO_MAP_PLANS[currentDest][currentPlan][dayIndex];
    } else if (typeof PHOTO_MAP !== "undefined" && PHOTO_MAP[currentDest] && PHOTO_MAP[currentDest][dayIndex]) {
      photos = PHOTO_MAP[currentDest][dayIndex];
    }
    if (photos && photos.length > 0) {
      html += '<div class="day-photos">';
      for (var p = 0; p < photos.length; p++) {
        var src = "assets/photos/" + encodeURIComponent(photos[p].file);
        html += '<div class="day-photo-item">' +
          '<img src="' + src + '" alt="' + escapeHtml(photos[p].caption) +
          '" title="' + escapeHtml(photos[p].caption) +
          '" data-full="' + src + '" class="day-photo-thumb">' +
          '<div class="day-photo-caption">' + escapeHtml(photos[p].caption) + '</div>' +
        '</div>';
      }
      html += '</div>';
    }
    
    html += '<div class="day-content">' + content + "</div>";
    html += "</div></div>";
    return html;
  }

  function renderItinerary(plan) {
    var html = "";
    if (plan.days && plan.days.length > 0) {
      html += '<h3 class="section-title">每日行程</h3>';
      for (var i = 0; i < plan.days.length; i++) {
        html += renderDayCard(plan.days[i], i);
      }
    } else if (plan.summary_table && plan.summary_table.length > 0) {
      html += '<h3 class="section-title">行程简表</h3>';
      html += renderTable(plan.summary_table, "summary-table");
    }
    return html;
  }

  function renderCostTable(plan) {
    if (!plan.cost_table || plan.cost_table.length === 0) return "";
    return '<h3 class="section-title">费用明细</h3>' +
      renderTable(plan.cost_table, "cost-detail-table", true);
  }

  function renderPriceWarnings(dest) {
    if (!dest.price_warnings || dest.price_warnings.length === 0) return "";
    var html = '<h3 class="section-title">十一假期价格提醒</h3>';
    for (var i = 0; i < dest.price_warnings.length; i++) {
      html += '<div class="warning-card">' + escapeHtml(dest.price_warnings[i]) + "</div>";
    }
    return html;
  }

  function renderFlightInfo(info) {
    var html = '<h3 class="section-title">' + escapeHtml(info.heading || "机票方案对比") + "</h3>";
    if (info.tables && info.tables.length > 0) {
      for (var i = 0; i < info.tables.length; i++) {
        html += renderTable(info.tables[i], "flight-table");
      }
    }
    if (info.text) {
      html += '<div class="flight-text">' + escapeHtml(info.text) + "</div>";
    }
    return html;
  }

  function renderTips(tips) {
    var keys = Object.keys(tips);
    if (keys.length === 0) return "";
    var html = '<h3 class="section-title">实用贴士</h3><div class="tips-grid">';
    for (var i = 0; i < keys.length; i++) {
      html += '<div class="tip-card">' +
        '<h4 class="tip-title">' + escapeHtml(keys[i]) + "</h4>" +
        '<div class="tip-content">' + formatTipContent(tips[keys[i]]) + "</div>" +
      "</div>";
    }
    html += "</div>";
    return html;
  }

  function renderPlanContent() {
    var dest = TRAVEL_DATA[currentDest];
    var plan = dest.plans[currentPlan];
    var container = document.getElementById("planContent");
    var html = "";

    html += renderCostOverview(plan);
    html += renderItinerary(plan);
    html += renderCostTable(plan);

    container.innerHTML = html;
    
    // Bind photo click events
    var thumbs = container.querySelectorAll(".day-photo-thumb");
    for (var t = 0; t < thumbs.length; t++) {
      thumbs[t].addEventListener("click", function() {
        openPhotoModal(this);
      });
    }
  }

  function getPlanPerPerson(plan) {
    var ct = plan.cost_table;
    if (!ct || ct.length === 0) return "";
    var lastRow = ct[ct.length - 1];
    // Format 1: ['合计', '59,922', '人均 29,961元']
    if (lastRow[2]) {
      var match = String(lastRow[2]).match(/人均\s*([\d,]+)/);
      if (match) return match[1];
    }
    // Format 2: ['人均', '29,166']
    if (lastRow[0] && String(lastRow[0]).indexOf("人均") >= 0 && lastRow[1]) {
      return String(lastRow[1]).replace(/[^\d,]/g, "");
    }
    return "";
  }

  function renderPlanTabs() {
    var dest = TRAVEL_DATA[currentDest];
    var container = document.getElementById("planTabs");
    var html = "";
    for (var i = 0; i < dest.plans.length; i++) {
      var cls = i === currentPlan ? "plan-tab active" : "plan-tab";
      var planName = stripEmojis(dest.plans[i].name);
      var perPerson = getPlanPerPerson(dest.plans[i]);
      // Split "方案A · 方案名称" into label and name
      var label = "";
      var name = planName;
      var sepIdx = planName.indexOf("·");
      if (sepIdx >= 0) {
        label = planName.substring(0, sepIdx).trim();
        name = planName.substring(sepIdx + 1).trim();
      }
      html += '<button class="' + cls + '" data-plan="' + i + '">';
      if (label) {
        html += '<span class="plan-tab-label">' + escapeHtml(label) + '</span>';
      }
      html += '<span class="plan-tab-name">' + escapeHtml(name) + '</span>';
      if (perPerson) {
        html += '<span class="plan-tab-cost">人均 ¥' + escapeHtml(perPerson) + '</span>';
      }
      html += '</button>';
    }
    container.innerHTML = html;

    var buttons = container.querySelectorAll(".plan-tab");
    for (var j = 0; j < buttons.length; j++) {
      buttons[j].addEventListener("click", function() {
        var idx = parseInt(this.getAttribute("data-plan"), 10);
        selectPlan(idx);
      });
    }
  }

  function renderDestTabs() {
    var container = document.getElementById("destTabs");
    var html = "";
    for (var i = 0; i < DEST_NAMES.length; i++) {
      var cls = i === currentDest ? "dest-tab active" : "dest-tab";
      html += '<button class="' + cls + '" data-dest="' + i + '">' +
        escapeHtml(DEST_NAMES[i]) + "</button>";
    }
    container.innerHTML = html;

    var buttons = container.querySelectorAll(".dest-tab");
    for (var j = 0; j < buttons.length; j++) {
      buttons[j].addEventListener("click", function() {
        var idx = parseInt(this.getAttribute("data-dest"), 10);
        selectDest(idx);
      });
    }
  }

  function renderDestFooter() {
    var dest = TRAVEL_DATA[currentDest];
    var container = document.getElementById("destFooter");
    var html = "";

    if (dest.comparison_table && dest.comparison_table.length > 0) {
      html += '<h3 class="section-title">方案费用对比</h3>';
      html += renderTable(dest.comparison_table, "comparison-table");
    }

    if (dest.flight_info) {
      html += renderFlightInfo(dest.flight_info);
    }

    if (dest.tips) {
      html += renderTips(dest.tips);
    }

    container.innerHTML = html;
  }

  function selectPlan(idx) {
    currentPlan = idx;
    renderPlanTabs();
    renderPlanContent();
  }

  function selectDest(idx) {
    currentDest = idx;
    currentPlan = 0;
    renderDestTabs();
    renderPlanTabs();
    renderPlanContent();
    renderDestFooter();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function openPhotoModal(img) {
    var modal = document.getElementById("photoModal");
    var modalImg = document.getElementById("photoModalImg");
    var modalCaption = document.getElementById("photoModalCaption");
    modalImg.src = img.getAttribute("data-full") || img.src;
    modalCaption.textContent = img.alt || "";
    modal.classList.add("active");
  }

  function closePhotoModal() {
    var modal = document.getElementById("photoModal");
    modal.classList.remove("active");
  }

  function init() {
    if (typeof TRAVEL_DATA === "undefined" || !TRAVEL_DATA || TRAVEL_DATA.length === 0) {
      document.getElementById("planContent").innerHTML =
        '<div class="warning-card">数据加载失败，请确保 assets/travel_data.js 文件存在。</div>';
      return;
    }
    renderDestTabs();
    selectDest(0);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }

  // Close modal on click
  document.addEventListener("click", function(e) {
    var modal = document.getElementById("photoModal");
    if (modal && modal.classList.contains("active")) {
      if (e.target === modal || e.target.id === "photoModalImg") {
        closePhotoModal();
      }
    }
  });

  // Close modal on Escape key
  document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") {
      closePhotoModal();
    }
  });
})();
</script>

<!-- Photo Modal -->
<div class="photo-modal" id="photoModal">
  <img id="photoModalImg" src="" alt="">
  <div class="photo-modal-caption" id="photoModalCaption"></div>
</div>

</body>
</html>
